name: Build Windows Installer

on:
  push:
    branches: [main]
    paths:
      - 'tunnel-core/**'
      - 'windows-app/**'
      - 'vpn-app/ui/**'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Windows app (MSVC, static CRT)
        env:
          RUSTFLAGS: "-C target-feature=+crt-static"
        run: cargo build --package vpn-demo-windows --release --target x86_64-pc-windows-msvc

      - name: Download wintun.dll
        run: |
          Invoke-WebRequest -Uri "https://www.wintun.net/builds/wintun-0.14.1.zip" -OutFile wintun.zip
          Expand-Archive wintun.zip -DestinationPath wintun-extracted
          Copy-Item "wintun-extracted/wintun/bin/amd64/wintun.dll" "target/release/"

      - name: Install NSIS
        run: choco install nsis -y

      - name: Build installer
        run: |
          Copy-Item "target/x86_64-pc-windows-msvc/release/vpn-demo-windows.exe" "windows-app/installer/"
          Copy-Item "target/x86_64-pc-windows-msvc/release/wintun.dll" "windows-app/installer/"
          & "C:\Program Files (x86)\NSIS\makensis.exe" "windows-app/installer/installer.nsi"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: VPNDemo-Windows-Installer
          path: windows-app/installer/VPNDemo-Setup.exe

      - name: Upload portable
        uses: actions/upload-artifact@v4
        with:
          name: VPNDemo-Windows-Portable
          path: |
            target/x86_64-pc-windows-msvc/release/vpn-demo-windows.exe
            target/x86_64-pc-windows-msvc/release/wintun.dll
