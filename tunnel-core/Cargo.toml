[package]
name = "tunnel-core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib", "lib"]

[dependencies]
netstack-smoltcp = "0.2"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros"] }
futures = "0.3"
fast-socks5 = "1"
log = "0.4"
oslog = "0.2"
once_cell = "1"
parking_lot = "0.12"
